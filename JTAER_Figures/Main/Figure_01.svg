   <g id="text_1">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="308.16" y="43.506036" transform="rotate(-0 308.16 43.506036)">Three annual KISDI survey waves</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(167.261641 61.850352)">2023 baseline → 2024 outcome / baseline → 2025 outcome</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(119.360859 73.931977)">Baseline privacy hesitation and next-wave linkage define the restricted cohorts</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="157.266" y="136.341955" transform="rotate(-0 157.266 136.341955)">Development · 2023 → 2024</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(83.007914 154.686271)">1,565 respondents; 880 events</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(61.952055 166.767896)">H + seven candidate information blocks</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="459.054" y="136.341955" transform="rotate(-0 459.054 136.341955)">Temporal evaluation · 2024 → 2025</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(384.795914 154.686271)">1,520 respondents; 853 events</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(383.388727 166.767896)">641 shared; 879 person-disjoint</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="157.266" y="239.492975" transform="rotate(-0 157.266 239.492975)">Select using development data</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(80.943148 257.837291)">Ridge / HGB; item budgets 0–30</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(65.783227 269.918916)">Five-fold tuning and portfolio selection</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(70.056 282.000541)">Original nested CV: 2 × 5 outer folds</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="459.054" y="239.492975" transform="rotate(-0 459.054 239.492975)">Freeze, refit, and evaluate</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(336.89068 257.837291)">Fit selected configurations on all development data</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(358.997477 269.918916)">Assess whole and person-disjoint samples</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(357.256305 282.000541)">Keep the full-information reference explicit</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="308.16" y="359.835832" transform="rotate(-0 308.16 359.835832)">Two paired comparisons answer different questions</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(109.992969 378.180148)">Incremental value: selected model versus P0 (H available) or NONE (H unavailable)</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(158.257422 390.261773)">Preservation: selected model versus the full-information model</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(149.623555 402.343398)">Positive model-minus-reference log loss indicates worse prediction</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="157.266" y="470.436649" transform="rotate(-0 157.266 470.436649)">Uncertainty and measurement checks</text>
   </g>
   <g id="text_14">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(40.490961 488.780965)">Paired fixed-fit bootstrap; full-process reselection</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(66.198109 500.86259)">Calibration and within-period holdouts</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(66.205531 512.944215)">Adjacent-service response diagnostics</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(80.941664 525.02584)">Post hoc capital-region recoding</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="459.054" y="470.436649" transform="rotate(-0 459.054 470.436649)">Added sensitivity analyses</text>
   </g>
   <g id="text_16">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(329.626148 488.780965)">Wider Ridge/HGB searches; random forest; extra trees</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(377.836422 500.86259)">XGBoost, LightGBM, and CatBoost</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(353.626266 512.944215)">Full linked panel; weights; H+D already held</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(367.46732 525.02584)">Block contributions, total and per item</text>
   </g>
  </g>
 </g>
